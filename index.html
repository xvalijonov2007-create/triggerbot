<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigger Bot - WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #0b0c0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px 15px 80px 15px;
        }

        /* Top Header Navigation */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .lang-select {
            background: transparent;
            color: #fff;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .balance-container {
            background: #15171e;
            border: 1px solid #232733;
            border-radius: 12px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .balance-coin {
            color: #f3ba2f;
        }
        .add-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Menu Nav Tab Bar */
        .nav-tabs {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 8px;
            margin-bottom: 15px;
            border-bottom: 1px solid #1c1f26;
            scrollbar-width: none;
        }
        .nav-tabs::-webkit-scrollbar { display: none; }
        .tab-item {
            color: #838a9c;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            padding-bottom: 5px;
        }
        .tab-item.active {
            color: #ffffff;
            border-bottom: 2px solid #ec4899;
        }

        /* Content Sections */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Keyslar Grid Layout */
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .case-card {
            background: #14161d;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid #1f232d;
            cursor: pointer;
        }
        .case-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .case-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .case-badge.hit { background: #f97316; }
        .case-details {
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .case-title {
            font-weight: bold;
            font-size: 14px;
        }
        .case-price {
            background: #1e222d;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            color: #f3ba2f;
            font-weight: bold;
        }

        /* Inventar Grid */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .inventory-card {
            background: #14161d;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #1f232d;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .inv-title { font-size: 13px; font-weight: bold; margin-bottom: 6px; }
        .inv-price { color: #f3ba2f; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
        .inv-sell-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }

        /* Bonuslar (Vazifalar) Section */
        .task-card {
            background: #14161d;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #1f232d;
        }
        .task-info h4 { margin: 0 0 4px 0; font-size: 14px; }
        .task-info p { margin: 0; font-size: 11px; color: #6b7280; }
        .task-btn {
            background: #0088cc;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
        }

        /* Profile Section */
        .profile-box {
            background: #14161d;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #1f232d;
        }
        .profile-avatar {
            width: 70px;
            height: 70px;
            background: #0088cc;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        /* Roulette Modal */
        .roulette-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            z-index: 999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .roulette-box {
            width: 100%;
            height: 120px;
            border: 2px solid #f3ba2f;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #111;
        }
